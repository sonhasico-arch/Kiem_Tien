<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KML/KMZ sang DXF - OSM</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; color: #222; }
    header { padding: 12px 16px; background: #145da0; color: white; }
    header h2 { margin: 0 0 5px; font-size: 20px; }
    header p { margin: 0; font-size: 13px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; align-items: center; }
    button, input[type=file] { padding: 9px; }
    button { border: 0; border-radius: 4px; background: #145da0; color: white; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #map { height: calc(100vh - 155px); min-height: 400px; width: 100%; }
    #status { padding: 0 12px 10px; font-size: 13px; white-space: pre-wrap; }
    .hint { color: #555; font-size: 12px; padding: 0 12px 8px; }
  </style>
</head>
<body>
  <header>
    <h2>Chuyển đổi KML/KMZ sang DXF</h2>
    <p>Chọn khu vực trên bản đồ. DXF dùng hệ tọa độ Web Mercator (EPSG:3857).</p>
  </header>
  <div class="toolbar">
    <input id="fileInput" type="file" accept=".kml,.kmz">
    <button id="uploadBtn" type="button">Tải KML/KMZ</button>
    <button id="exportBtn" type="button">Xuất DXF khu vực bản đồ</button>
    <button id="resetBtn" type="button">Về Việt Nam</button>
  </div>
  <div class="hint">
    Giới hạn OSM: tối đa 5 km² mỗi lần xuất. OSM phụ thuộc dịch vụ Overpass và có thể chậm khi máy chủ quá tải.
    Đường OSM xuất thành đường tâm để giảm RAM.
  </div>
  <div id="status">Đang khởi tạo bản đồ...</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([21.0285, 105.8542], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const statusEl = document.getElementById('status');
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const exportBtn = document.getElementById('exportBtn');
    const resetBtn = document.getElementById('resetBtn');

    let uploaded = false;
    let uploadLayer = L.layerGroup().addTo(map);

    function setStatus(message) { statusEl.textContent = message; }

    uploadBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) {
        setStatus('Vui lòng chọn file .kml hoặc .kmz trước.');
        return;
      }
      const form = new FormData();
      form.append('file', file);
      uploadBtn.disabled = true;
      setStatus('Đang đọc file KML/KMZ...');
      try {
        const response = await fetch('/upload_kml', { method: 'POST', body: form });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Upload thất bại.');
        uploaded = true;
        setStatus(`Đã tải ${file.name}\nSố điểm: ${data.points}\nSố tuyến: ${data.lines}\nBấm “Xuất DXF khu vực bản đồ” để xuất dữ liệu trong khung bản đồ hiện tại.`);
      } catch (error) {
        setStatus('Lỗi upload: ' + error.message);
      } finally {
        uploadBtn.disabled = false;
      }
    });

    exportBtn.addEventListener('click', async () => {
      const b = map.getBounds();
      const payload = {
        north: b.getNorth(),
        south: b.getSouth(),
        east: b.getEast(),
        west: b.getWest()
      };
      exportBtn.disabled = true;
      setStatus('Đang xuất DXF. Nếu dịch vụ OSM chậm, vui lòng chờ; không đóng trang.');
      try {
        const response = await fetch('/export_dxf', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!response.ok) {
          let message = `HTTP ${response.status}`;
          try {
            const data = await response.json();
            if (data.error) message = data.error;
          } catch (_) {}
          throw new Error(message);
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'export_kml_osm.dxf';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        const warning = response.headers.get('X-OSM-Warning') || '';
        const osmCount = response.headers.get('X-OSM-Entities') || '0';
        const kmlLines = response.headers.get('X-KML-Lines') || '0';
        const kmlPoints = response.headers.get('X-KML-Points') || '0';
        const area = response.headers.get('X-Selected-Area-Km2') || '?';
        let msg = `Đã tạo file DXF.\nDiện tích vùng chọn: ${area} km²\nĐường OSM: ${osmCount}\nTuyến KML/KMZ: ${kmlLines}\nĐiểm KML/KMZ: ${kmlPoints}`;
        if (warning) msg += `\nCảnh báo: ${warning}`;
        setStatus(msg);
      } catch (error) {
        setStatus('Xuất DXF thất bại: ' + error.message + '\nNếu Render log có SIGKILL, hãy giảm vùng chọn và thử lại.');
      } finally {
        exportBtn.disabled = false;
      }
    });

    resetBtn.addEventListener('click', () => map.setView([21.0285, 105.8542], 13));
    setStatus('Bản đồ đã sẵn sàng. Chọn file KML/KMZ nếu cần, sau đó chọn vùng và xuất DXF.');
  </script>
</body>
</html>
